<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BA"/>
      <stop offset="25%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#C8A24A"/>
      <stop offset="100%" stop-color="#8E6716"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38A178"/>
      <stop offset="50%" stop-color="#006B4F"/>
      <stop offset="100%" stop-color="#062E25"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08382E"/>
      <stop offset="50%" stop-color="#062E25"/>
      <stop offset="100%" stop-color="#021712"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Fondo circular verde esmeralda con borde de oro fino -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Corona Real -->
  <g filter="url(#shadow)">
    <!-- Cuerpo de la corona con 5 picos -->
    <path d="M13 43 L17 24 L24 33 L32 15 L40 33 L47 24 L51 43 Z" fill="url(#goldGrad)" stroke="#FFF0BA" stroke-width="0.8" stroke-linejoin="round"/>

    <!-- Banda de la base arqueada -->
    <path d="M13 43 Q32 47 51 43 L51 47 Q32 51 13 47 Z" fill="url(#goldGrad)" stroke="#FFF0BA" stroke-width="0.6"/>

    <!-- Joyas/Perlas brillantes en las puntas -->
    <circle cx="17" cy="23" r="2.8" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <circle cx="24" cy="32" r="2.2" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <circle cx="32" cy="14" r="3.6" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="1"/>
    <circle cx="40" cy="32" r="2.2" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <circle cx="47" cy="23" r="2.8" fill="#FFFDF5" stroke="url(#goldGrad)" stroke-width="0.8"/>

    <!-- Diamante esmeralda central -->
    <polygon points="32,25 36,32 32,39 28,32" fill="url(#emeraldGrad)" stroke="#FFF0BA" stroke-width="0.8"/>

    <!-- Gemas esmeralda en la diadema inferior -->
    <circle cx="22" cy="45" r="1.8" fill="url(#emeraldGrad)" stroke="#FFF0BA" stroke-width="0.5"/>
    <circle cx="32" cy="47" r="2.2" fill="url(#emeraldGrad)" stroke="#FFF0BA" stroke-width="0.5"/>
    <circle cx="42" cy="45" r="1.8" fill="url(#emeraldGrad)" stroke="#FFF0BA" stroke-width="0.5"/>
  </g>
</svg>
